name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let a test touch a real data directory.
  SPYDER_HOME: ${{ github.workspace }}/.spyder-ci

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy spyder/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        # The pty tests are excluded here and run in their own job below: they
        # take ~13 min against ~1 min for everything else, and running them once
        # is enough — they exercise terminal behaviour, which does not vary with
        # the Python version this matrix is sweeping.
        run: pytest -q -m "not pty"

  terminal:
    name: Terminal tests (pty)
    runs-on: ubuntu-latest
    # Slow (~13 min) and inherently timing-sensitive, so it gets its own job:
    # a failure here is a real terminal regression and must not be lost in the
    # noise of a matrix, nor hold up the fast feedback the other jobs give.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest -m pty
        run: pytest -q -m pty

  packaging:
    name: Packaging & entry points
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl

      - name: All three entry points must agree
        run: |
          set -euo pipefail
          A=$(/tmp/fresh/bin/spyder --version)
          B=$(/tmp/fresh/bin/python -m spyder --version)
          C=$(/tmp/fresh/bin/python main.py --version)
          echo "spyder        -> $A"
          echo "python -m     -> $B"
          echo "python main.py-> $C"
          test "$A" = "$B"
          test "$B" = "$C"

      - name: Packaged version must match spyder.__version__
        run: |
          set -euo pipefail
          PKG=$(/tmp/fresh/bin/python -c "import importlib.metadata as m; print(m.version('spyder-recon'))")
          MOD=$(/tmp/fresh/bin/python -c "import spyder; print(spyder.__version__)")
          echo "metadata=$PKG module=$MOD"
          test "$PKG" = "$MOD"

      - name: py.typed must ship in the wheel
        run: /tmp/fresh/bin/python -c "import pathlib, spyder; assert (pathlib.Path(spyder.__file__).parent / 'py.typed').is_file()"

  security:
    name: Security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      # Fast, deterministic greps for the classes of defect that would be worst
      # in a security tool. The equivalent assertions also live in
      # tests/test_security_invariants.py; this job fails the build loudly.
      - name: No shell execution, dynamic eval, or unsafe deserialization
        run: |
          set -euo pipefail
          if grep -rnE "shell\s*=\s*True|os\.system|\beval\(|\bexec\(|pickle\.loads|yaml\.load\(" spyder/; then
            echo "::error::forbidden construct found in spyder/"
            exit 1
          fi
          echo "clean"

      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit || echo "::warning::pip-audit reported findings"
