<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200" role="img" aria-label="SPYDER">
  <defs>
    <radialGradient id="bgGlow" cx="22%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a0608"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2b3d"/>
      <stop offset="100%" stop-color="#7a1620"/>
    </linearGradient>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="460" height="200" rx="14" fill="url(#bgGlow)"/>

  <!-- web strands behind the spider -->
  <g stroke="#26262e" stroke-width="1" fill="none" opacity="0.7">
    <path d="M70 30 L70 170"/>
    <path d="M30 100 L110 100"/>
    <path d="M40 55 L100 145"/>
    <path d="M100 55 L40 145"/>
    <path d="M70 70 Q92 78 90 100 Q92 122 70 130 Q48 122 50 100 Q48 78 70 70 Z"/>
    <path d="M70 52 Q104 64 102 100 Q104 136 70 148 Q36 136 38 100 Q36 64 70 52 Z"/>
  </g>

  <!-- spider -->
  <g filter="url(#redGlow)" stroke="url(#legGrad)" stroke-width="4" stroke-linecap="round" fill="none">
    <!-- left legs -->
    <path d="M62 96 C44 86 34 80 24 86"/>
    <path d="M62 100 C42 98 30 98 20 104"/>
    <path d="M62 104 C44 112 34 118 26 128"/>
    <path d="M64 108 C50 122 44 134 46 148"/>
    <!-- right legs -->
    <path d="M78 96 C96 86 106 80 116 86"/>
    <path d="M78 100 C98 98 110 98 120 104"/>
    <path d="M78 104 C96 112 106 118 114 128"/>
    <path d="M76 108 C90 122 96 134 94 148"/>
  </g>
  <!-- body -->
  <g filter="url(#redGlow)">
    <ellipse cx="70" cy="92" rx="9" ry="8" fill="#ff2b3d"/>
    <ellipse cx="70" cy="108" rx="12" ry="15" fill="url(#legGrad)"/>
    <circle cx="66" cy="89" r="1.8" fill="#0a0a0c"/>
    <circle cx="74" cy="89" r="1.8" fill="#0a0a0c"/>
  </g>

  <!-- wordmark -->
  <g font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-weight="700">
    <text x="150" y="104" font-size="46" letter-spacing="6" fill="#e8e8ee">SP<tspan fill="#ff2b3d">Y</tspan>DER</text>
    <text x="152" y="128" font-size="11" letter-spacing="3.5" fill="#8a8a99">RED-TEAM WORKFLOW OS</text>
  </g>
</svg>
